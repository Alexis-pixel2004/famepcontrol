name: famep-prod

# Perfil de produccion: imagen cerrada para el codigo; el storage (uploads)
# se comparte por bind-mount entre app (escritura) y web (lectura).
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        INSTALL_DEV: "false"
    image: famep-app:prod
    # Sin montajes de desarrollo: el codigo ya vive en la imagen.
    # El storage es bind-mount (misma carpeta real que usa el host) para
    # que las evidencias subidas persistan y sean fáciles de respaldar.
    volumes:
      - ./storage:/var/www/html/storage
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:9090
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    ports:
      - "9090:80"
    volumes:
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage:/var/www/html/storage:ro

  db:
    ports: []

  adminer:
    profiles: ["never"]

networks:
  famep-net:
    driver: bridge